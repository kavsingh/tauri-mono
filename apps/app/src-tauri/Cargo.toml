[package]
name = "app"
version = "1.0.0-dev.0"
edition.workspace = true
description = "A Tauri App"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"

[dependencies]
chrono = "0.4.45"
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
sysinfo = "0.39.6"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2.9.0"
tauri-plugin-store = "2.4.3"
uuid = { version = "1.23.5", features = ["fast-rng", "v4"] }

[dependencies.tauri]
version = "2.11.5"
features = ["isolation", "specta"]

[dependencies.tauri-specta]
version = "2.0.0-rc.25"
features = ["derive", "typescript"]

[build-dependencies.tauri-build]
version = "2.6.3"
features = ["isolation"]

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
