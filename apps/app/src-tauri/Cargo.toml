[package]
name = "app"
version = "1.0.0-dev.0"
edition.workspace = true
description = "A Tauri App"
repository.workspace = true

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
# https://github.com/Choochmeque/tauri-plugin-webdriver#installation
# both tauri-plugin-wdio and tauri-plugin-wdio-webdriver required for e2e testing
e2e = ["tauri-plugin-wdio", "tauri-plugin-wdio-webdriver"]

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = "0.4.45"
ed25519-dalek = "2.2.0"
log = "0.4.35"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
specta = "2.0.0-rc.28"
specta-typescript = "0.0.15"
sysinfo = "0.40.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.2"
tauri-plugin-opener = "2.7.3"
tauri-plugin-store = "2.5.1"
tauri-plugin-wdio = { version = "1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
uuid = { version = "1.29.2", features = ["fast-rng", "v4"] }

[dependencies.tauri]
version = "2.12.5"
features = ["isolation", "specta"]

[dependencies.tauri-specta]
version = "2.0.0-rc.29"
features = ["derive", "typescript"]

[build-dependencies.tauri-build]
version = "2.7.4"
features = ["isolation"]

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Foundation", "Win32_Storage_FileSystem"]

[lints]
workspace = true
