packages:
  - apps/*
  - packages/*

savePrefix: ''

minimumReleaseAge: 4320 # 3 days in minutes
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
verifyDepsBeforeRun: prompt

catalog:
  '@tauri-apps/api': 2.12.3
  '@tauri-apps/plugin-log': 2.10.1
  '@tsconfig/node26': 26.0.1
  '@tsconfig/strictest': 2.0.8
  '@types/node': 26.6.5
  '@wdio/tauri-plugin': 1.5.0
  neverthrow: 8.2.0
  oxlint: 1.87.0
  oxlint-plugin-eslint: 1.87.0
  vite: 8.3.4

allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  lefthook: true
  nx: true
