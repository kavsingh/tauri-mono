packages:
  - apps/*
  - packages/*

savePrefix: ''

minimumReleaseAge: 4320 # 3 days in minutes
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
verifyDepsBeforeRun: prompt

catalog:
  '@tsconfig/node26': 26.0.0
  '@tsconfig/strictest': 2.0.8
  '@types/node': 26.1.1
  oxlint: 1.73.0

allowBuilds:
  lefthook: true
  nx: true
