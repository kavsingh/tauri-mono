packages:
  - apps/*
  - packages/*

savePrefix: ''

minimumReleaseAge: 4320 # 3 days in minutes
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
verifyDepsBeforeRun: prompt

catalog:
  '@tsconfig/node26': 26.0.1
  '@tsconfig/strictest': 2.0.8
  '@types/node': 26.6.5
  effect: 4.0.2
  oxlint: 1.87.0
  oxlint-plugin-eslint: 1.87.0

allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  lefthook: true
  nx: true
