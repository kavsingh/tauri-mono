packages:
  - apps/*
  - packages/*

savePrefix: ''

minimumReleaseAge: 4320 # 3 days in minutes
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
verifyDepsBeforeRun: prompt

catalog:
  '@tsconfig/node26': 26.0.0
  '@tsconfig/strictest': 2.0.8
  '@types/node': 26.1.2
  oxlint: 1.76.0

allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  lefthook: true
  nx: true

minimumReleaseAgeExclude:
  - '@wdio/cli@9.30.1'
  - '@wdio/config@9.30.1'
  - '@wdio/dot-reporter@9.30.1'
  - '@wdio/local-runner@9.30.1'
  - '@wdio/mocha-framework@9.30.1'
  - '@wdio/native-core@1.1.0'
  - '@wdio/native-spy@1.2.0'
  - '@wdio/native-types@2.5.0'
  - '@wdio/native-utils@2.6.0'
  - '@wdio/protocols@9.30.1'
  - '@wdio/reporter@9.30.1'
  - '@wdio/runner@9.30.1'
  - '@wdio/spec-reporter@9.30.1'
  - '@wdio/tauri-plugin@1.3.0'
  - '@wdio/tauri-service@1.3.0'
  - '@wdio/types@9.30.1'
  - '@wdio/utils@9.30.1'
  - '@wdio/xvfb@9.30.1'
  - create-wdio@9.30.1
  - webdriver@9.30.1
  - webdriverio@9.30.1
