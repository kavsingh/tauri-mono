blockExoticSubdeps: true
minimumReleaseAge: 4320 # 3 days in minutes
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
verifyDepsBeforeRun: prompt

packages:
  - apps/*
  - packages/*

savePrefix: ''

catalog:
  '@tsconfig/node26': 26.0.2
  '@tsconfig/strictest': 2.0.9
  '@types/node': 26.6.6
  effect: 4.1.5
  neverthrow: 8.2.0
  oxlint: 1.94.0
  oxlint-plugin-eslint: 1.94.0
  vite: 8.3.8

catalogs:
  tauri:
    '@tauri-apps/api': 2.12.5
    '@tauri-apps/cli': 2.12.6
    '@tauri-apps/plugin-dialog': 2.8.4
    '@tauri-apps/plugin-log': 2.10.2
    "@tauri-apps/plugin-store": 2.5.1

  wdio:
    '@wdio/tauri-plugin': 1.5.1
    '@wdio/tauri-service': 1.5.1

allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  lefthook: true
  nx: true

permissions:
  '@solidjs/web':
    skills: true
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/router-plugin':
    skills: true
  '@tanstack/solid-router':
    skills: true

  solid-js:
    skills: [reactivity-diagnostics, solid-2.0, solid-2.0-cheatsheet]
skills:
  dirs:
    - .agent/skills
    - .claude/skills
    - .github/skills

minimumReleaseAgeExclude:
  - '*solid*'
  - '@tanstack/virtual-core@3.19.13'

trustPolicyExclude:
  - '*solid*'
